<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Gapino - AI Chat</title>
  <script src="debug.js" defer></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div id="overlay" class="overlay" aria-hidden="true"></div>
    <aside id="drawer" class="drawer" aria-label="منوی گفتگوها">
      <header class="drawer-header">
        <div class="drawer-header-actions">
          <button type="button" id="closeDrawerBtn" class="icon-btn" aria-label="بستن منو">
            <svg viewBox="0 0 24 24" class="icon-close" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" id="themeToggle" class="icon-btn theme-toggle" aria-label="تغییر پوسته">
            <svg viewBox="0 0 24 24" class="theme-icon theme-icon-auto" aria-hidden="true">
              <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2" />
            </svg>
            <svg viewBox="0 0 24 24" class="theme-icon theme-icon-light" aria-hidden="true">
              <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 2v1M12 21v1M4.22 4.22l.7.7M19.08 19.08l.7.7M2 12h1M21 12h1M4.22 19.78l.7-.7M19.08 4.92l.7-.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <svg viewBox="0 0 24 24" class="theme-icon theme-icon-dark" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <button type="button" id="newChatBtn" class="primary-btn">گفت‌وگوی جدید</button>
      </header>
      <section class="drawer-section">
        <div class="chat-list" style="margin-bottom: 12px;">
          <button id="imageGenDrawerBtn" class="chat-item image-gen-drawer-btn" style="width: 100%; border: none; cursor: pointer; text-align: right; padding: 0; background: var(--chat-item-bg);">
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; width: 100%;">
              <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: currentColor; flex-shrink: 0;">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
              </svg>
              <span>تولید تصویر</span>
            </div>
          </button>
        </div>
        <h2 class="drawer-subtitle">گفت‌وگوها</h2>
        <ul id="chatList" class="chat-list"></ul>
      </section>
    </aside>
    <header class="topbar">
      <button type="button" id="menuBtn" class="icon-btn" aria-label="باز کردن منو">
        <svg viewBox="0 0 24 24" class="icon-hamburger" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" class="topbar-title model-picker-trigger" id="modelPickerBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="انتخاب مدل">
        <span id="topbarTitle">Gemini 3.1 Flash Lite</span>
        <svg class="model-picker-chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div id="imageModeTitle" class="topbar-title image-mode-title" hidden>Z-Image Turbo</div>
      <div id="modelMenu" class="model-menu" role="listbox" aria-label="مدل‌های گفتگو" hidden></div>
      <button type="button" id="profileBtn" class="icon-btn" aria-label="پروفایل و تنظیمات">
        <svg viewBox="0 0 24 24" class="icon-user" aria-hidden="true">
          <path d="M12 12.2a4.2 4.2 0 1 0-4.2-4.2 4.2 4.2 0 0 0 4.2 4.2Zm0 2.3c-4.1 0-7.5 2.4-7.5 5.3V21h15v-1.2c0-2.9-3.4-5.3-7.5-5.3Z" fill="currentColor" />
        </svg>
      </button>
    </header>
    <div id="profileModal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <div class="modal-header">
          <h2 id="profileModalTitle">پروفایل و جزئیات</h2>
          <button type="button" id="closeProfileBtn" class="icon-btn" aria-label="بستن پنجره">
            <svg viewBox="0 0 24 24" class="icon-close" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="field-label">نحوهٔ پاسخ‌دهی</span>
            <textarea id="profileResponseStyle" class="field-textarea" rows="7" placeholder="مثلاً کوتاه، دقیق، مرحله‌به‌مرحله..."></textarea>
          </label>
          <label class="field">
            <span class="field-label">نام</span>
            <input id="profileName" type="text" class="field-input" placeholder="نام شما" />
          </label>
          <label class="field">
            <span class="field-label">شغل / نقش</span>
            <input id="profileJob" type="text" class="field-input" placeholder="مثلاً دانشجو" />
          </label>
          <label class="field">
            <span class="field-label">جزئیات کاربر</span>
            <textarea id="profileSystemPrompt" class="field-textarea" rows="7" placeholder="اطلاعات کاربر..."></textarea>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" id="saveProfileBtn" class="primary-btn full">ذخیره</button>
        </div>
      </div>
    </div>
    <main id="chatMain" class="chat-main" style="display: flex; flex-direction: column; height: 100%; flex: 1;">
      <section id="emptyState" class="empty-state" aria-label="شروع گفتگو">
        <div class="empty-text">گپینو؛ هم‌اکنون قدرت گرفته با Ai</div>
      </section>
      <section id="messagesSection" class="messages" aria-label="گفت‌وگو"></section>
    </main>
    <section id="imageGenSection" class="image-gen-section" style="display: none; flex-direction: column; background: var(--app-bg-color);">
      <div class="image-gen-input-wrapper">
        <div class="image-gen-input-box">
          <textarea id="imagePromptInput" class="composer-input" rows="1" placeholder=" " aria-label="نوشتن پرامپت تصویر" style="flex: 1; min-height: 24px; max-height: 80px;"></textarea>
          <div class="composer-watermark" id="imagePromptWatermark">چه تصویری می‌خوای بسازی؟</div>
          <button type="button" id="imageSendBtn" class="send-btn" aria-label="ارسال پرامپت">
          <svg viewBox="0 0 24 24" class="icon-send" aria-hidden="true">
              <path d="M12 19V5m0 0 6 6m-6-6-6 6" />
            </svg>
          </button>
        </div>
      </div>
      <div class="image-gen-grid-wrapper">
        <h3 class="image-gen-grid-title">تصاویر من</h3>
        <div id="savedImagesGrid" class="image-gen-grid"></div>
      </div>
    </section>
    <footer class="composer" id="chatComposer">
      <div class="composer-inner">
        <textarea id="userInput" class="composer-input" rows="1" aria-label="نوشتن پیام" placeholder=" "></textarea>
        <div class="composer-watermark" id="composerWatermark">پیام خود را بنویسید...</div>
        <button type="button" id="sendBtn" class="send-btn" aria-label="ارسال پیام">
          <svg viewBox="0 0 24 24" class="icon-send" aria-hidden="true">
            <path d="M12 19V5m0 0 6 6m-6-6-6 6" />
          </svg>
        </button>
      </div>
    </footer>
    <div id="imageResultModal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="imageResultTitle">
        <div class="modal-header">
          <h2 id="imageResultTitle">تصویر تولید شده</h2>
          <button type="button" id="closeImageResultBtn" class="icon-btn" aria-label="بستن پنجره">
            <svg viewBox="0 0 24 24" class="icon-close" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="modal-body" style="text-align: center; padding: 20px;">
          <div id="imageResultContainer" style="margin-bottom: 20px;">
            <img id="generatedImage" src="" alt="تصویر تولید شده" style="width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);" />
          </div>
          <p style="margin-bottom: 16px; color: var(--text-color);">آیا می‌خوای این عکس رو ذخیره کنی؟</p>
          <div style="display: flex; gap: 12px; justify-content: center;">
            <button type="button" id="saveImageResultBtn" class="primary-btn">ذخیره</button>
            <button type="button" id="discardImageResultBtn" class="primary-btn" style="background: #c94b4b;">حذف</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
